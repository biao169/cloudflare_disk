<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CloudDrive 一键部署链接生成器</title>
<style>body{font:16px system-ui,-apple-system,sans-serif;max-width:640px;margin:7vh auto;padding:0 20px;line-height:1.7}input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid #bbb;border-radius:8px}button{padding:12px 18px;margin-top:14px;border:0;background:#1656a5;color:#fff;border-radius:8px;cursor:pointer}p{color:#555}code{overflow-wrap:anywhere}</style>
</head><body><h1>CloudDrive 一键部署</h1><p>先将 ZIP 中 <code>CloudDrive/</code> 文件夹内的源代码上传到公开 GitHub/GitLab 仓库根目录；再输入真实仓库网址。这只是链接生成器，不会接收或保存你的账户密钥。</p>
<label for="repo">公开 Git 仓库 URL</label><input id="repo" placeholder="https://github.com/你的账号/CloudDrive" autocomplete="off">
<button id="go">打开 Cloudflare 一键部署页面</button><p id="status" role="status"></p>
<hr><h2>首次管理员初始化密钥</h2><p>点击生成，保存这个密钥，然后在 Cloudflare 部署向导的 <code>BOOTSTRAP_TOKEN</code> 输入栏或 Worker 的 Secret 设置中填写。首次管理员创建完成后应删除/轮换该 Secret。密钥只在浏览器本地生成，不会发往本项目服务器。</p><input id="secret" readonly placeholder="点击下面按钮生成 256 位随机密钥" aria-label="初始化密钥"><button id="newkey" type="button">生成安全初始化密钥</button> <button id="copykey" type="button">复制密钥</button><p id="secret-status" role="status"></p>
<script>document.getElementById('go').addEventListener('click',()=>{const value=document.getElementById('repo').value.trim();let u;try{u=new URL(value)}catch{};const ok=u&&u.protocol==='https:'&&['github.com','gitlab.com'].includes(u.hostname)&&u.pathname.split('/').filter(Boolean).length>=2;const out=document.getElementById('status');if(!ok){out.textContent='请输入真实的公开 GitHub 或 GitLab 仓库 URL。';return;}out.textContent='已打开 Cloudflare 官方部署页。如浏览器阻止弹窗，请允许打开新标签页。';window.open('https://deploy.workers.cloudflare.com/?url='+encodeURIComponent(u.origin+u.pathname.replace(/\/$/,'')),'_blank','noopener,noreferrer');});document.getElementById('newkey').addEventListener('click',()=>{const key=document.getElementById('secret'),out=document.getElementById('secret-status');if(!globalThis.crypto?.getRandomValues){out.textContent='当前浏览器不支持安全随机数，请在 HTTPS 页面或可信本地环境生成安全密钥。';return;}const bytes=crypto.getRandomValues(new Uint8Array(32));key.value=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');out.textContent='已生成 64 位十六进制字符（256 位随机密钥）。请妥善保存。';});document.getElementById('copykey').addEventListener('click',async()=>{const key=document.getElementById('secret'),out=document.getElementById('secret-status');if(!key.value){out.textContent='请先生成密钥';return;}try{await navigator.clipboard.writeText(key.value);out.textContent='已复制密钥。'}catch{key.select();out.textContent='浏览器无法直接复制，已选中密钥，请按 Ctrl+C。'}});</script></body></html>
