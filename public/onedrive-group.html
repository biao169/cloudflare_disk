<!doctype html>
<html lang="zh-CN" data-bs-theme="light">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
 <meta name="description" content="CloudDrive OneDrive 文件夹与文件合集分享"><title>OneDrive 分享合集 · CloudDrive</title>
 <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css"><link rel="stylesheet" href="/css/onedrive-share.css"><link rel="stylesheet" href="/css/onedrive-group.css">
</head>
<body><div class="ods-shell">
 <header class="ods-top"><a href="/" class="ods-brand">☁ <span>CloudDrive</span></a><span class="ods-top-badge">OneDrive 目录分享</span></header>
 <main class="ods-main odg-main">
  <article class="ods-card odg-card">
   <div class="odg-hero"><span class="odg-hero-icon" aria-hidden="true">▤</span><div><span class="odg-eyebrow" id="odg-kind">OneDrive 分享</span><h1 id="odg-title">正在加载分享…</h1><p id="odg-desc" class="odg-desc" hidden></p><p id="odg-summary" class="odg-summary"></p></div></div>
   <div class="odg-content">
    <div id="odg-access" aria-live="polite"></div>
    <div id="odg-state" role="status" aria-live="polite"></div>
    <nav id="odg-breadcrumb" class="odg-breadcrumb" aria-label="分享目录"></nav>
    <div class="odg-toolbar"><span id="odg-count"></span><div class="odg-tools"><button type="button" id="odg-copy">复制分享链接</button><button type="button" id="odg-qr-toggle">二维码</button></div></div>
    <div id="odg-list" class="odg-list" aria-label="分享文件列表"></div>
    <section id="odg-qr-panel" class="ods-qr-panel" hidden><div id="odg-qr-image"></div><p>扫码访问文件夹分享页面</p><button type="button" id="odg-qr-save" class="ods-button ods-secondary">保存二维码</button></section>
   </div>
  </article>
 </main>
 <footer class="ods-footer">本页面是发布时的静态目录快照。文件保存在 OneDrive，下载权限由 CloudDrive 固定链接控制；来源删除或授权失效可能导致下载失败。</footer>
 </div><script type="module" src="/js/onedrive-group.js"></script></body>
</html>
