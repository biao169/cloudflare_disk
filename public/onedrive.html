<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneDrive 链接解析 · CloudDrive</title><link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css"><link rel="stylesheet" href="/css/app.css"></head>
<body><main class="container py-5" style="max-width:760px"><a href="/" class="text-decoration-none">CloudDrive</a><h1 class="h3 mt-4">OneDrive 分享链接解析</h1><p class="text-secondary">当管理员允许匿名解析时，游客无需登录即可检查 OneDrive 公开分享链接的格式；关闭后需先登录 CloudDrive。格式解析不会绕过微软权限，也不会伪造下载直链。</p><form id="od-form" class="card p-4 gap-3"><label for="od-url">OneDrive 分享链接</label><textarea id="od-url" class="form-control" rows="3" maxlength="4096" required placeholder="https://1drv.ms/t/c/..."></textarea><button class="btn btn-primary" type="submit">检查链接</button></form><section class="mt-3" id="od-result" aria-live="polite"></section><p class="small text-secondary mt-4">微软分享的访问权限和有效期由文件所有者决定。此工具不会绕过授权限制。</p></main><script type="module" src="/js/onedrive-tool.js"></script></body></html>
