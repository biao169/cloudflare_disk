<!doctype html><html lang="zh-CN" data-bs-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · CloudDrive</title><link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"><script type="module" src="/js/login.js"></script></head><body class="bg-body-tertiary d-flex align-items-center justify-content-center min-vh-100 p-3"><main class="card shadow-sm w-100" style="max-width:430px"><div class="card-body p-4"><h1 class="h3 mb-2">CloudDrive</h1><p class="text-body-secondary mb-4" id="subtitle">账号登录</p><div id="message" role="alert" class="alert alert-danger d-none" style="white-space:pre-wrap"></div><form id="auth-form" hidden><div class="mb-3"><label for="username" class="form-label">用户名</label><input id="username" class="form-control" autocomplete="username" required minlength="3" maxlength="40"></div><div class="mb-3"><label for="password" class="form-label">密码</label><input type="password" id="password" class="form-control" autocomplete="current-password" required minlength="6" maxlength="256"></div><div class="form-text mb-2">登录密码长度为 6–128 个字符</div><div id="bootstrap-wrap" class="mb-3 d-none"><label class="form-label" for="bootstrap-token">首次初始化令牌</label><input type="password" id="bootstrap-token" class="form-control" autocomplete="off"><div class="form-text">填写 Cloudflare Worker Secret：BOOTSTRAP_TOKEN；本地开发使用 .dev.vars。</div></div><button id="submit" class="btn btn-primary w-100" type="submit">登录</button></form></div></main></body></html>
